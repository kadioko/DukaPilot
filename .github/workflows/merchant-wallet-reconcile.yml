name: nTZS Payment Reconciliation

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile known nTZS wallet and subscription operations
        env:
          WALLET_CRON_SECRET: ${{ secrets.MERCHANT_WALLET_RECONCILE_CRON_SECRET }}
        run: |
          if [ -z "$WALLET_CRON_SECRET" ]; then
            echo "nTZS payment reconciliation is not configured yet."
            exit 0
          fi
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $WALLET_CRON_SECRET" \
            https://dukapilotproduction.up.railway.app/api/cron/merchant-wallet-reconcile
